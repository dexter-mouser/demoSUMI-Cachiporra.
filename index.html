<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>La Cachiporra — Fargo Suministros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* ======================================================================
   TOKENS DE MARCA — tomados literalmente de fargo-suministros-guia-de-marca.md
   ====================================================================== */
:root{
  --fargo-cyan:      #00AEEF;
  --fargo-magenta:   #EC008C;
  --fargo-yellow:    #FFD400;
  --fargo-key:       #1A1A1A;
  --fargo-blue-700:  #0B4F8A;
  --fargo-blue-500:  #1E7FC2;
  --fargo-gray-100:  #E6E6E6;
  --fargo-gray-300:  #C9C9C9;
  --fargo-gray-600:  #5C5C5C;
  --fargo-white:     #FFFFFF;
  --fargo-success:   #2FAE60;
  --fargo-danger:    #E4483E;

  --radius-card: 20px;
  --radius-pill: 999px;
  --shadow-card: 0 10px 30px rgba(11,79,138,0.14);
  --font-display: 'Poppins', system-ui, sans-serif;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:var(--font-display);
  background:var(--fargo-gray-100);
  color:var(--fargo-key);
  -webkit-tap-highlight-color:transparent;
}
button{ font-family:inherit; }
h1,h2,h3,p{ margin:0; }

/* respeta "prefers-reduced-motion" */
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
}

/* ---------- estructura general ---------- */
#app-shell{
  min-height:100%;
  display:flex;
  flex-direction:column;
  max-width:520px;
  margin:0 auto;
  background:var(--fargo-gray-100);
}

.topbar{
  background:var(--fargo-blue-700);
  color:var(--fargo-white);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0.6rem 1rem;
  gap:0.75rem;
}
.topbar img.brand-logo{
  height:26px;
  display:block;
  filter:brightness(0) invert(1); /* logo a blanco sobre azul corporativo */
}
.topbar .game-badge{
  font-weight:700;
  font-size:0.78rem;
  letter-spacing:0.02em;
  background:var(--fargo-magenta);
  color:var(--fargo-white);
  padding:0.3rem 0.75rem;
  border-radius:var(--radius-pill);
  white-space:nowrap;
}

main{
  flex:1;
  padding:1.25rem 1rem 2.5rem;
  display:flex;
  flex-direction:column;
  gap:1rem;
}

.card{
  background:var(--fargo-white);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
  border-top:4px solid var(--fargo-cyan);
  padding:1.4rem 1.3rem;
}
.card.accent-magenta{ border-top-color:var(--fargo-magenta); }
.card.accent-yellow{ border-top-color:var(--fargo-yellow); }

.eyebrow{
  font-size:0.72rem;
  font-weight:600;
  color:var(--fargo-blue-500);
  margin:0 0 0.35rem;
}
h1.title{
  font-size:1.55rem;
  font-weight:800;
  line-height:1.2;
  color:var(--fargo-key);
}
h2.subtitle{
  font-size:1.05rem;
  font-weight:700;
  color:var(--fargo-blue-700);
}
p.body-text{
  font-size:0.94rem;
  line-height:1.5;
  color:var(--fargo-gray-600);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:0.5rem;
  border:none;
  border-radius:var(--radius-pill);
  padding:0.85rem 1.6rem;
  font-weight:700;
  font-size:0.95rem;
  cursor:pointer;
  transition:transform .15s ease;
  width:100%;
}
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:0.45; cursor:not-allowed; }
.btn-primary{ background:var(--fargo-magenta); color:var(--fargo-white); }
.btn-primary:hover:not(:disabled){ transform:translateY(-2px); }
.btn-secondary{ background:var(--fargo-blue-700); color:var(--fargo-white); }
.btn-ghost{ background:var(--fargo-gray-100); color:var(--fargo-key); }

.field{ display:flex; flex-direction:column; gap:0.4rem; }
.field label{ font-size:0.82rem; font-weight:600; color:var(--fargo-gray-600); }
.field input[type="text"]{
  border:2px solid var(--fargo-gray-300);
  border-radius:12px;
  padding:0.7rem 0.85rem;
  font-size:0.95rem;
  font-family:inherit;
  color:var(--fargo-key);
}
.field input[type="text"]:focus{
  outline:none;
  border-color:var(--fargo-cyan);
}

.stepper{
  display:flex;
  align-items:center;
  gap:1rem;
  justify-content:center;
}
.stepper button{
  width:44px; height:44px;
  border-radius:50%;
  border:2px solid var(--fargo-blue-700);
  background:var(--fargo-white);
  color:var(--fargo-blue-700);
  font-size:1.3rem;
  font-weight:700;
  cursor:pointer;
}
.stepper button:disabled{ opacity:0.35; cursor:not-allowed; }
.stepper .count{
  font-size:1.6rem;
  font-weight:800;
  min-width:2ch;
  text-align:center;
}

.name-list{ display:flex; flex-direction:column; gap:0.6rem; }

/* dots CMYK — guiño al icono/isotipo de la guía de marca */
.cmyk-dots{ display:flex; gap:6px; }
.cmyk-dots span{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.cmyk-dots span:nth-child(1){ background:var(--fargo-cyan); }
.cmyk-dots span:nth-child(2){ background:var(--fargo-magenta); }
.cmyk-dots span:nth-child(3){ background:var(--fargo-yellow); }
.cmyk-dots span:nth-child(4){ background:var(--fargo-key); }

/* ---------- pasar dispositivo ---------- */
.pass-visual{
  display:flex;
  justify-content:center;
  padding:0.5rem 0 0.75rem;
}
.pass-visual img{ width:150px; height:150px; object-fit:contain; }

/* ---------- teclado numérico secreto ---------- */
.keypad{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:0.55rem;
}
.keypad button{
  aspect-ratio:1/1;
  border-radius:14px;
  border:2px solid var(--fargo-gray-300);
  background:var(--fargo-white);
  font-size:1.15rem;
  font-weight:700;
  color:var(--fargo-key);
  cursor:pointer;
}
.keypad button.selected{
  border-color:var(--fargo-magenta);
  background:var(--fargo-magenta);
  color:var(--fargo-white);
}

/* ---------- tablero de juego ---------- */
.turn-banner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:var(--fargo-blue-700);
  color:var(--fargo-white);
  border-radius:16px;
  padding:0.85rem 1.1rem;
}
.turn-banner .who{ font-weight:800; font-size:1.05rem; }
.turn-banner .hint{ font-size:0.72rem; opacity:0.85; }

.board-grid{
  display:grid;
  grid-template-columns:repeat(5, 1fr);
  gap:0.6rem;
  user-select:none;
  touch-action:none;
}
.board-cell{
  position:relative;
  aspect-ratio:1/1;
  border-radius:14px;
  background:var(--fargo-white);
  border:2px solid var(--fargo-gray-300);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.3rem;
  font-weight:800;
  color:var(--fargo-key);
  overflow:hidden;
  cursor:grab;
}
.board-cell.crossed{
  color:var(--fargo-gray-300);
  border-color:var(--fargo-gray-300);
  cursor:default;
}
.board-cell .strike{
  position:absolute;
  left:8%;
  top:50%;
  width:0%;
  height:4px;
  background:var(--fargo-magenta);
  transform:translateY(-50%) rotate(-18deg);
  transform-origin:left center;
  border-radius:4px;
  transition:width .05s linear;
}
.board-cell.crossed .strike{
  width:84%;
  background:var(--fargo-gray-600);
}

.hands-row{
  display:flex;
  gap:0.55rem;
  overflow-x:auto;
  padding-bottom:0.2rem;
}
.hand-card{
  flex:0 0 auto;
  width:78px;
  border-radius:12px;
  padding:0.55rem 0.4rem;
  text-align:center;
  background:var(--fargo-blue-500);
  color:var(--fargo-white);
}
.hand-card .hand-icon{
  width:34px; height:34px;
  margin:0 auto 0.35rem;
  border-radius:50%;
  background:var(--fargo-white);
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--fargo-blue-700);
  font-weight:800;
}
.hand-card.eliminated{
  background:var(--fargo-gray-300);
  color:var(--fargo-gray-600);
}
.hand-card.eliminated .hand-icon{
  background:var(--fargo-white);
  color:var(--fargo-danger);
}
.hand-card .hand-name{
  font-size:0.68rem;
  font-weight:700;
  line-height:1.15;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hand-card.current-turn{ outline:3px solid var(--fargo-yellow); }

.history-box{
  background:var(--fargo-white);
  border-radius:14px;
  padding:0.75rem 0.9rem;
  font-size:0.84rem;
  color:var(--fargo-gray-600);
  border:1px dashed var(--fargo-gray-300);
}
.history-box strong{ color:var(--fargo-key); }

/* ---------- pantalla final ---------- */
.final-visual{ display:flex; justify-content:center; }
.final-visual img{ width:180px; height:180px; object-fit:contain; }
.final-title{ text-align:center; }
.winners-list{
  display:flex;
  flex-wrap:wrap;
  gap:0.4rem;
  justify-content:center;
}
.winners-list span{
  background:var(--fargo-gray-100);
  border-radius:var(--radius-pill);
  padding:0.3rem 0.7rem;
  font-size:0.78rem;
  font-weight:600;
}
.bet-box{
  background:var(--fargo-yellow);
  border-radius:14px;
  padding:0.9rem 1rem;
  text-align:center;
  font-weight:800;
  color:var(--fargo-key);
}

.footer-note{
  text-align:center;
  font-size:0.72rem;
  color:var(--fargo-gray-600);
  padding:0.5rem 1rem 1.25rem;
}

.hidden{ display:none !important; }

</style>
</head>

<script>
"use strict";

/* ============================================================================
   1) CONSTANTES CON NOMBRE
   (sección 1 del documento de diseño — reemplaza literales sueltos)
   ========================================================================== */
const BOARD_SIZE = 10;
const MIN_PLAYERS = 2;
const MAX_PLAYERS = 10;

// Fracción de la diagonal de la celda que hay que arrastrar para que cuente
// como "tachado" (gesto de arrastre, no un toque). Era un número mágico sin
// resolver en la bitácora (0.7 / 0.75); se fija aquí en 0.6 como valor por
// defecto documentado y fácil de ajustar.
const DRAG_THRESHOLD_FRACTION = 0.6;

const GAME_PHASE = {
  CONFIG: "CONFIG",
  SESSION: "SESSION",
  TIEBREAK_ANNOUNCE: "TIEBREAK_ANNOUNCE",
  GAME_OVER: "GAME_OVER"
};

const SESSION_STAGE = {
  SETUP_PASS_DEVICE: "SETUP_PASS_DEVICE",
  SETUP_PICK_SECRET: "SETUP_PICK_SECRET",
  PLAYING: "PLAYING"
};

const ENGINE_EVENT = {
  IGNORED_ALREADY_CROSSED: "IGNORED_ALREADY_CROSSED",
  NO_EFFECT: "NO_EFFECT",
  ELIMINATED: "ELIMINATED",
  GAME_OVER_BURN: "GAME_OVER_BURN",
  GAME_OVER_ELIMINATION: "GAME_OVER_ELIMINATION",
  GAME_OVER_TIE_LOSS: "GAME_OVER_TIE_LOSS",
  BOARD_TIEBREAK: "BOARD_TIEBREAK"
};

const LOSE_REASON = {
  BURN: "BURN",
  ELIMINATION: "ELIMINATION",
  TIE_LOSS: "TIE_LOSS"
};

/* ============================================================================
   2) MOTOR DEL JUEGO (lógica pura — nunca toca el DOM)
   Implementa, en este orden, el resumen ejecutivo (sección 6 de la
   especificación / sección 4 del documento de diseño).
   ========================================================================== */

function createSession(playerIds) {
  return {
    players: playerIds.map(id => ({ id, secretNumber: null, alive: true })),
    board: Array.from({ length: BOARD_SIZE }, (_, i) => ({ number: i + 1, crossedOut: false })),
    currentTurnIndex: 0,
    setupIndex: 0,
    stage: SESSION_STAGE.SETUP_PASS_DEVICE,
    history: [],
    outcome: { status: "PENDING", reason: null, loserId: null, winnerIds: [], pendingTiebreak: null }
  };
}

function cloneSession(session) {
  return JSON.parse(JSON.stringify(session));
}

function getCurrentPlayer(session) {
  return session.players[session.currentTurnIndex];
}

function getAlivePlayers(session) {
  return session.players.filter(p => p.alive);
}

function getPlayersWithSecret(session, number, { aliveOnly = false } = {}) {
  return session.players.filter(p => p.secretNumber === number && (!aliveOnly || p.alive));
}

// Único lugar que decide "a quién le toca ahora" (sección 3.2 de la especificación).
function getNextAliveIndex(session, fromIndex) {
  const n = session.players.length;
  for (let step = 1; step <= n; step++) {
    const idx = (fromIndex + step) % n;
    if (session.players[idx].alive) return idx;
  }
  return fromIndex;
}

function makeHistoryEntry(session, actorId, number, event, affectedPlayerIds) {
  return {
    actorId,
    numberCrossed: number,
    event,
    affectedPlayerIds
  };
}

// Los "ganadores" son SIEMPRE todos los demás jugadores del partido completo,
// no solo los del sub-tablero donde se resolvió (sección 3.6). matchPlayers
// es la lista global e inmutable creada en CONFIG.
function buildOutcome(reason, loserId) {
  return {
    status: "RESOLVED",
    reason,
    loserId,
    winnerIds: matchPlayers.filter(p => p.id !== loserId).map(p => p.id),
    pendingTiebreak: null
  };
}

/**
 * resolveCross: función central del motor (sección 4 del documento de diseño).
 * Recibe la sesión activa y el número ya confirmado por gesto de arrastre.
 * Devuelve { event, session } — nunca muta la sesión recibida.
 */
function resolveCross(session, number) {
  const cell = session.board.find(c => c.number === number);

  // Regla 1 (resumen ejecutivo, punto 1): número ya tachado -> se ignora.
  if (cell.crossedOut) {
    return { event: ENGINE_EVENT.IGNORED_ALREADY_CROSSED, session };
  }

  const actor = getCurrentPlayer(session);
  const remainingBefore = session.board.filter(c => !c.crossedOut).length;
  const isLastAvailableNumber = remainingBefore === 1; // sección 3.4

  const aliveSharers = getPlayersWithSecret(session, number, { aliveOnly: true });

  // Regla 2 (sección 3.4/5.5): tablero agotado + 2+ jugadores vivos comparten
  // el número -> desempate real. DEBE evaluarse antes que la regla de empate
  // general (regla 5); ese orden es exactamente la corrección aplicada en 5.5.
  if (isLastAvailableNumber && aliveSharers.length >= 2) {
    const next = cloneSession(session);
    next.board.find(c => c.number === number).crossedOut = true;
    next.history.push(makeHistoryEntry(next, actor.id, number, ENGINE_EVENT.BOARD_TIEBREAK, aliveSharers.map(p => p.id)));
    next.outcome = {
      status: "PENDING",
      reason: null,
      loserId: null,
      winnerIds: [],
      pendingTiebreak: { involvedPlayerIds: aliveSharers.map(p => p.id), reasonForTiebreak: "BOARD_EXHAUSTED" }
    };
    return { event: ENGINE_EVENT.BOARD_TIEBREAK, session: next };
  }

  // Regla 3 (sección 3.3, primer caso): quema la olla.
  if (actor.secretNumber === number) {
    const next = cloneSession(session);
    next.board.find(c => c.number === number).crossedOut = true;
    next.history.push(makeHistoryEntry(next, actor.id, number, ENGINE_EVENT.GAME_OVER_BURN, [actor.id]));
    next.outcome = buildOutcome(LOSE_REASON.BURN, actor.id);
    return { event: ENGINE_EVENT.GAME_OVER_BURN, session: next };
  }

  const othersSharing = aliveSharers.filter(p => p.id !== actor.id);

  // Regla 4 (sección 3.3, tercer caso): secreto de exactamente un jugador vivo.
  if (othersSharing.length === 1) {
    const eliminatedId = othersSharing[0].id;
    const next = cloneSession(session);
    next.board.find(c => c.number === number).crossedOut = true;
    next.players.find(p => p.id === eliminatedId).alive = false;
    const aliveAfter = next.players.filter(p => p.alive);

    if (aliveAfter.length === 1) {
      next.history.push(makeHistoryEntry(next, actor.id, number, ENGINE_EVENT.GAME_OVER_ELIMINATION, [eliminatedId]));
      next.outcome = buildOutcome(LOSE_REASON.ELIMINATION, aliveAfter[0].id);
      return { event: ENGINE_EVENT.GAME_OVER_ELIMINATION, session: next };
    }
    next.history.push(makeHistoryEntry(next, actor.id, number, ENGINE_EVENT.ELIMINATED, [eliminatedId]));
    next.currentTurnIndex = getNextAliveIndex(next, next.currentTurnIndex);
    return { event: ENGINE_EVENT.ELIMINATED, session: next };
  }

  // Regla 5 (sección 3.3, cuarto caso / 3.5): secreto de 2+ vivos, sin ser el
  // caso de tablero agotado -> pierde quien tachó.
  if (othersSharing.length >= 2) {
    const next = cloneSession(session);
    next.board.find(c => c.number === number).crossedOut = true;
    next.history.push(makeHistoryEntry(next, actor.id, number, ENGINE_EVENT.GAME_OVER_TIE_LOSS, othersSharing.map(p => p.id)));
    next.outcome = buildOutcome(LOSE_REASON.TIE_LOSS, actor.id);
    return { event: ENGINE_EVENT.GAME_OVER_TIE_LOSS, session: next };
  }

  // Regla 6 (sección 3.3, segundo caso): nadie vivo tiene ese secreto.
  const next = cloneSession(session);
  next.board.find(c => c.number === number).crossedOut = true;
  next.history.push(makeHistoryEntry(next, actor.id, number, ENGINE_EVENT.NO_EFFECT, []));
  next.currentTurnIndex = getNextAliveIndex(next, next.currentTurnIndex);
  return { event: ENGINE_EVENT.NO_EFFECT, session: next };
}

/* ============================================================================
   3) ESTADO DE LA APLICACIÓN (controlador — el único lugar con "impureza")
   ========================================================================== */

let matchPlayers = [];      // [{id, name}] — fijo durante todo el partido
let bet = "";
let currentSession = null;
let appPhase = GAME_PHASE.CONFIG;
let tiebreakDepth = 0;
let matchOutcome = null;
let configDraft = { count: 4, names: ["", "", "", ""], bet: "" };

function playerName(id) {
  const p = matchPlayers.find(p => p.id === id);
  return p ? p.name : "?";
}

function startMatch(names, betText) {
  matchPlayers = names.map((name, i) => ({ id: "p" + i, name: name.trim() || ("Jugador " + (i + 1)) }));
  bet = betText.trim();
  currentSession = createSession(matchPlayers.map(p => p.id));
  tiebreakDepth = 0;
  matchOutcome = null;
  appPhase = GAME_PHASE.SESSION;
  render();
}

function handleContinuePassDevice() {
  currentSession.stage = SESSION_STAGE.SETUP_PICK_SECRET;
  render();
}

function handlePickSecret(number) {
  const idx = currentSession.setupIndex;
  currentSession.players[idx].secretNumber = number;
  currentSession.setupIndex++;
  if (currentSession.setupIndex >= currentSession.players.length) {
    currentSession.stage = SESSION_STAGE.PLAYING;
  } else {
    currentSession.stage = SESSION_STAGE.SETUP_PASS_DEVICE;
  }
  render();
}

function handleCrossConfirmed(number) {
  const { event, session } = resolveCross(currentSession, number);
  currentSession = session;

  if (event === ENGINE_EVENT.BOARD_TIEBREAK) {
    appPhase = GAME_PHASE.TIEBREAK_ANNOUNCE;
  } else if (
    event === ENGINE_EVENT.GAME_OVER_BURN ||
    event === ENGINE_EVENT.GAME_OVER_ELIMINATION ||
    event === ENGINE_EVENT.GAME_OVER_TIE_LOSS
  ) {
    matchOutcome = currentSession.outcome;
    appPhase = GAME_PHASE.GAME_OVER;
  }
  render();
}

function handleStartTiebreakRound() {
  const involvedIds = currentSession.outcome.pendingTiebreak.involvedPlayerIds;
  tiebreakDepth++;
  currentSession = createSession(involvedIds);
  appPhase = GAME_PHASE.SESSION;
  render();
}

function handleRestart() {
  matchPlayers = [];
  bet = "";
  currentSession = null;
  appPhase = GAME_PHASE.CONFIG;
  tiebreakDepth = 0;
  matchOutcome = null;
  configDraft = { count: 4, names: ["", "", "", ""], bet: "" };
  render();
}

/* ============================================================================
   4) VISTA (renderizado — solo lee el estado, nunca decide reglas)
   ========================================================================== */

const app = document.getElementById("app");

function render() {
  app.innerHTML = "";
  if (appPhase === GAME_PHASE.CONFIG) return renderConfig();
  if (appPhase === GAME_PHASE.TIEBREAK_ANNOUNCE) return renderTiebreakAnnounce();
  if (appPhase === GAME_PHASE.GAME_OVER) return renderGameOver();

  // GAME_PHASE.SESSION -> depende de la etapa interna de la sesión
  if (currentSession.stage === SESSION_STAGE.SETUP_PASS_DEVICE) return renderPassDevice();
  if (currentSession.stage === SESSION_STAGE.SETUP_PICK_SECRET) return renderPickSecret();
  if (currentSession.stage === SESSION_STAGE.PLAYING) return renderPlaying();
}

function el(tag, className, html) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

/* ---------- CONFIG ---------- */
function renderConfig() {
  const card = el("div", "card");
  card.appendChild(el("p", "eyebrow", "Antes de empezar"));
  card.appendChild(el("h1", "title", "Configura la partida"));
  card.appendChild(el("p", "body-text",
    "Elige cuántas personas juegan, sus nombres y qué debe invitar quien pierda La Cachiporra."));
  app.appendChild(card);

  // número de jugadores
  const stepperCard = el("div", "card accent-magenta");
  stepperCard.appendChild(el("h2", "subtitle", "Número de jugadores"));
  const stepper = el("div", "stepper");
  const minus = el("button", null, "−");
  const count = el("span", "count", String(configDraft.count));
  const plus = el("button", null, "+");
  minus.disabled = configDraft.count <= MIN_PLAYERS;
  plus.disabled = configDraft.count >= MAX_PLAYERS;
  minus.onclick = () => { adjustPlayerCount(-1); };
  plus.onclick = () => { adjustPlayerCount(1); };
  stepper.appendChild(minus);
  stepper.appendChild(count);
  stepper.appendChild(plus);
  stepperCard.appendChild(stepper);
  app.appendChild(stepperCard);

  // nombres
  const namesCard = el("div", "card accent-yellow");
  namesCard.appendChild(el("h2", "subtitle", "Nombres"));
  const list = el("div", "name-list");
  for (let i = 0; i < configDraft.count; i++) {
    const field = el("div", "field");
    const label = el("label", null, "Jugador " + (i + 1));
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Nombre";
    input.value = configDraft.names[i] || "";
    input.maxLength = 20;
    input.oninput = (e) => { configDraft.names[i] = e.target.value; };
    field.appendChild(label);
    field.appendChild(input);
    list.appendChild(field);
  }
  namesCard.appendChild(list);
  app.appendChild(namesCard);

  // apuesta
  const betCard = el("div", "card");
  betCard.appendChild(el("h2", "subtitle", "La apuesta de la tienda"));
  betCard.appendChild(el("p", "body-text", "Lo que debe invitar quien pierda."));
  const betField = el("div", "field");
  const betInput = document.createElement("input");
  betInput.type = "text";
  betInput.placeholder = "Ej: una ronda de gaseosas";
  betInput.value = configDraft.bet;
  betInput.oninput = (e) => { configDraft.bet = e.target.value; };
  betField.appendChild(betInput);
  betCard.appendChild(betField);
  app.appendChild(betCard);

  const startBtn = el("button", "btn btn-primary", "Comenzar partida");
  startBtn.onclick = () => {
    startMatch(configDraft.names.slice(0, configDraft.count), configDraft.bet);
  };
  app.appendChild(startBtn);
}

function adjustPlayerCount(delta) {
  const next = configDraft.count + delta;
  if (next < MIN_PLAYERS || next > MAX_PLAYERS) return;
  configDraft.count = next;
  while (configDraft.names.length < next) configDraft.names.push("");
  configDraft.names.length = next;
  render();
}

/* ---------- ELEGIR NÚMERO SECRETO ---------- */
function renderPickSecret() {
  const player = currentSession.players[currentSession.setupIndex];
  let selected = null;

  const card = el("div", "card");
  card.appendChild(el("p", "eyebrow", "Número secreto"));
  card.appendChild(el("h1", "title", escapeHtml(playerName(player.id)) + ", elige tu número"));
  card.appendChild(el("p", "body-text", "Puede repetirse con el de otro jugador — eso es parte del juego."));
  app.appendChild(card);

  const keypadCard = el("div", "card accent-yellow");
  const keypad = el("div", "keypad");
  const buttons = [];
  for (let n = 1; n <= BOARD_SIZE; n++) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = String(n);
    b.onclick = () => {
      selected = n;
      buttons.forEach(x => x.classList.remove("selected"));
      b.classList.add("selected");
      confirmBtn.disabled = false;
    };
    buttons.push(b);
    keypad.appendChild(b);
  }
  keypadCard.appendChild(keypad);
  app.appendChild(keypadCard);

  const confirmBtn = el("button", "btn btn-primary", "Confirmar número");
  confirmBtn.disabled = true;
  confirmBtn.onclick = () => {
    if (selected !== null) handlePickSecret(selected);
  };
  app.appendChild(confirmBtn);
}

/* ---------- TABLERO / TACHADO ---------- */
function renderPlaying() {
  const actor = getCurrentPlayer(currentSession);

  const banner = el("div", "turn-banner");
  const who = el("div");
  who.appendChild(el("div", "who", "Turno de " + escapeHtml(playerName(actor.id))));
  who.appendChild(el("div", "hint", "Arrastra sobre un número para tacharlo"));
  banner.appendChild(who);
  banner.appendChild(cmykDots());
  app.appendChild(banner);

  const boardCard = el("div", "card accent-magenta");
  const grid = el("div", "board-grid");
  currentSession.board.forEach(cell => {
    grid.appendChild(buildBoardCell(cell));
  });
  boardCard.appendChild(grid);
  app.appendChild(boardCard);

  const handsWrap = el("div", "card");
  handsWrap.appendChild(el("h2", "subtitle", "Jugadores"));
  const hands = el("div", "hands-row");
  currentSession.players.forEach(p => {
    hands.appendChild(buildHandCard(p, p.id === actor.id));
  });
  handsWrap.appendChild(hands);
  app.appendChild(handsWrap);

  const lastMove = currentSession.history[currentSession.history.length - 1];
  const historyBox = el("div", "history-box", describeHistoryEntry(lastMove));
  app.appendChild(historyBox);
}

function cmykDots() {
  const wrap = el("div", "cmyk-dots");
  wrap.appendChild(el("span"));
  wrap.appendChild(el("span"));
  wrap.appendChild(el("span"));
  wrap.appendChild(el("span"));
  return wrap;
}

function buildHandCard(player, isCurrentTurn) {
  const card = el("div", "hand-card" + (player.alive ? "" : " eliminated") + (isCurrentTurn && player.alive ? " current-turn" : ""));
  const icon = el("div", "hand-icon", player.alive ? "?" : String(player.secretNumber));
  card.appendChild(icon);
  card.appendChild(el("div", "hand-name", escapeHtml(playerName(player.id))));
  return card;
}

function describeHistoryEntry(entry) {
  if (!entry) return "Toca un número y arrástralo para empezar a tachar.";
  const actor = "<strong>" + escapeHtml(playerName(entry.actorId)) + "</strong>";
  switch (entry.event) {
    case ENGINE_EVENT.NO_EFFECT:
      return actor + " tachó el " + entry.numberCrossed + " — sin efecto.";
    case ENGINE_EVENT.ELIMINATED:
      return actor + " tachó el " + entry.numberCrossed + " y eliminó a <strong>" +
        escapeHtml(playerName(entry.affectedPlayerIds[0])) + "</strong>.";
    default:
      return actor + " tachó el " + entry.numberCrossed + ".";
  }
}

// ---- gesto de arrastre para tachar (DRAG_THRESHOLD_FRACTION) ----
function buildBoardCell(cell) {
  const div = el("div", "board-cell" + (cell.crossedOut ? " crossed" : ""), String(cell.number));
  const strike = el("div", "strike");
  div.appendChild(strike);

  if (cell.crossedOut) return div;

  let dragging = false;
  let startX = 0, startY = 0;

  const getThresholdPx = () => {
    const rect = div.getBoundingClientRect();
    const diagonal = Math.hypot(rect.width, rect.height);
    return diagonal * DRAG_THRESHOLD_FRACTION;
  };

  const onMove = (clientX, clientY) => {
    if (!dragging) return;
    const dist = Math.hypot(clientX - startX, clientY - startY);
    const pct = Math.min(100, (dist / getThresholdPx()) * 100);
    strike.style.width = pct + "%";
    strike.style.background = "var(--fargo-magenta)";
  };

  const finishDrag = (clientX, clientY) => {
    if (!dragging) return;
    dragging = false;
    const dist = Math.hypot(clientX - startX, clientY - startY);
    if (dist >= getThresholdPx()) {
      handleCrossConfirmed(cell.number); // re-renderiza todo el tablero
    } else {
      strike.style.width = "0%";
    }
  };

  div.addEventListener("pointerdown", (e) => {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    div.setPointerCapture(e.pointerId);
  });
  div.addEventListener("pointermove", (e) => onMove(e.clientX, e.clientY));
  div.addEventListener("pointerup", (e) => finishDrag(e.clientX, e.clientY));
  div.addEventListener("pointercancel", () => { dragging = false; strike.style.width = "0%"; });

  return div;
}

/* ---------- ANUNCIO DE DESEMPATE (tablero agotado, sección 3.4) ---------- */
function renderTiebreakAnnounce() {
  const info = currentSession.outcome.pendingTiebreak;
  const names = info.involvedPlayerIds.map(id => playerName(id));

  const card = el("div", "card accent-yellow");
  card.appendChild(el("p", "eyebrow", "El tablero se agotó"));
  card.appendChild(el("h1", "title", "Hace falta un desempate real"));
  card.appendChild(el("p", "body-text",
    "El último número disponible del tablero era el secreto de más de un jugador a la vez. " +
    "Nadie tuvo otra jugada posible, así que no cuenta como derrota automática: " +
    names.map(escapeHtml).join(", ") +
    " van a jugar una ronda nueva, solo entre ustedes, con su propio tablero."));
  app.appendChild(card);

  const btn = el("button", "btn btn-secondary", "Iniciar desempate");
  btn.onclick = handleStartTiebreakRound;
  app.appendChild(btn);
}

/* ---------- PANTALLA FINAL (tres variantes, sección 4/5.7) ---------- */
function renderGameOver() {
  const loserName = playerName(matchOutcome.loserId);
  const winnerNames = matchOutcome.winnerIds.map(playerName);

  let accentClass = "accent-magenta";
  let title = "";
  let explanation = "";

  if (matchOutcome.reason === LOSE_REASON.BURN) {
    accentClass = "accent-magenta";
    title = escapeHtml(loserName) + " quemó la olla";
    explanation = "Tachó su propio número secreto — pierde al instante, sin importar cuántos jugadores seguían en pie.";
  } else if (matchOutcome.reason === LOSE_REASON.ELIMINATION) {
    accentClass = "accent-yellow";
    title = escapeHtml(loserName) + " fue el último en pie";
    explanation = "En La Cachiporra sobrevivir hasta el final es la condición de derrota, no de victoria.";
  } else if (matchOutcome.reason === LOSE_REASON.TIE_LOSS) {

/* ---------- utilidades de vista ---------- */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
